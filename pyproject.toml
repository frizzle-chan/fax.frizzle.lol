[project]
name = "fax-frizzle-lol"
version = "0.1.0"
description = ""
authors = [{ name = "frizzle-chan" }]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "discord-py (>=2.5.2,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "cachetools (>=5.5.2,<6.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "python-escpos (>=3.1,<4.0)",
    "requests (>=2.32.3,<3.0.0)",
    "arrow (>=1.3.0,<2.0.0)",
]

[dependency-groups]
dev = [
    "flake8>=7.2.0,<8",
    "autopep8>=2.3.2,<3",
    "pre-commit>=4.2.0,<5",
    "isort>=6.0.1,<7",
    "flake8-bugbear>=24.12.12,<25",
    "mypy>=1.15.0,<2",
    "types-requests>=2.32.0.20250328,<3",
    "types-cachetools>=5.5.0.20240820,<6",
    "pytest>=8.3.5,<9",
    "pytest-regressions[image]>=2.7.0,<3",
    "lefthook>=1.11.5",
]

[tool.uv]
package = false

[tool.hatch.build.targets.sdist]
include = ["fax_frizzle"]

[tool.hatch.build.targets.wheel]
include = ["fax_frizzle"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
module = ["escpos.*"]
follow_untyped_imports = true
