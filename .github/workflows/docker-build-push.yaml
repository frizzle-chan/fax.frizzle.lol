name: Build and Push Docker Image

on:
  pull_request:
    paths:
      - .github/workflows/docker-build-push.yaml
      - Dockerfile
      - .dockerignore
      - uv.lock
      - pyproject.toml
      - '**/*.py'
      # Non-.py test fixtures and image-regression baselines live here.
      - 'fax_frizzle/**'
  push:
    branches:
      - main
      - docker-build
    tags:
      - 'v*'
    paths:
      - .github/workflows/docker-build-push.yaml
      - Dockerfile
      - .dockerignore
      - uv.lock
      - pyproject.toml
      - '**/*.py'
      # Non-.py test fixtures and image-regression baselines live here.
      - 'fax_frizzle/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Single-arch on purpose: the runner can only execute what it loads, and
      # QEMU-emulated arm64 would just re-run the same pure-Python code slowly.
      - name: Build the devcontainer image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          target: devcontainer
          platforms: linux/amd64
          load: true
          tags: fax-frizzle:devcontainer
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      # The checkout is mounted over /app — the same layout devcontainer.json
      # uses, and the reason bin/test syncs first: the mount hides the image's
      # /app/.venv that PATH points into, so the venv has to be rebuilt against
      # the mounted source. What the image provides is the system half the
      # tests actually need, above all the UnifontEX the baselines were
      # rendered with.
      #
      # Running as the runner's uid rather than the image's keeps the workspace
      # writable for the sync without a chown, which would leave .git owned by
      # the wrong user and break the post-job checkout cleanup. It also leaves
      # the .obtained/.diff PNGs of a failed image regression on the runner
      # instead of dying with the container. HOME and the uv cache have to move
      # somewhere that uid can write, since both default under fax-frizzle's.
      - name: Run the test suite against the checkout
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/app" \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env UV_CACHE_DIR=/tmp/uv-cache \
            fax-frizzle:devcontainer \
            ./bin/test

  build-and-push:
    runs-on: ubuntu-latest
    # Don't pay for the emulated arm64 build (or publish a tag) if the tests
    # already failed on amd64.
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          target: production
          # Deploy targets are x86 and a Raspberry Pi (arm64).
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate scopes so the two jobs don't overwrite each other's cache;
          # reading the test scope reuses the amd64 layers it just built.
          cache-from: |
            type=gha,scope=build
            type=gha,scope=test
          cache-to: type=gha,scope=build,mode=max
